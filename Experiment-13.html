<!DOCTYPE html>
<html>
    <head>
        <title>Experiment-13 Handle events like onclick, onsubmit, and onmouseover.</title>
    </head>
    <body>
        <h2>JavaScript Event Hanlding</h2>
        
        <h3>1. Onlcick Event</h3>
        <button onclick="showMessage()">Click Me</button>
        <p id="msg"></p>

        <h3>2. Onsubmit Event</h3>
        <form onsubmit="return submitform()">
            Enter Name:
            <input type="text" id="name" required>
            <input type="submit" value="submit">
        </form>

        <h3>3. Onmouseover Event</h3>
        <p onmouseover="changeColor(this)">
            move your mouse over this text.
        </p>

        <script>
            function showMessage(){
                document.getElementById("msg").innerHTML="Button Clicked Successfully";
            }

            function changeColor(element){
                element.style.color= "red";
            }

            function submitform(){
                let name = document.getElementById("name").value;
                alert("Welcome "+ name);
                return false;
            }
            </script>

    </body>
</html>
