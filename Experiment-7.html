
<!DOCTYPE html>
<html>
<head>
    <title>Experiment-7 Create a responsive webpage using media queries</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        header {
            background-color: #198754;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: #333;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            padding: 15px 20px;
            text-decoration: none;
        }

        nav a:hover {
            background-color: #198754;
        }

    
        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .box {
            background-color: white;
            padding: 25px;
            flex: 1;
            text-align: center;
            border-radius: 8px;
        }

        @media screen and (max-width: 768px) {
            .container {
                flex-wrap: wrap;
            }

            .box {
                flex: 1 1 40%;
            }
        }

        @media screen and (max-width: 600px) {
            header {
                font-size: 18px;
            }

            nav {
                flex-direction: column;
                text-align: center;
            }

            .container {
                flex-direction: column;
            }

            .box {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Responsive Website</h1>
        <p>Learning Responsive Web Design</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">

        <div class="box">
            <h2>HTML</h2>
            <p>HTML is used to create the structure of a webpage.</p>
        </div>

        <div class="box">
            <h2>CSS</h2>
            <p>CSS is used to style and design a webpage.</p>
        </div>

        <div class="box">
            <h2>JavaScript</h2>
            <p>JavaScript is used to make webpages interactive.</p>
        </div>

    </div>

</body>
</html>
