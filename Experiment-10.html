<!DOCTYPE html>
<html>
    <head>
        <title>Experiment-10  Write JavaScript programs using variables, data types, and operators</title>
         
    </head>
    <body>
        <h1>javascript program using variables, data types, and operators</h1>
        <script>
            let name="Trisha";
            let age=20;
            
            document.write("<h3>Variable and Data Types</h3>");
            document.write("Name: "+name+"<br>");
            document.write("Age: "+age+"<br>");
            
            let a=10;
            let b=20;

            document.write("<h3>Arithmethic Operators</h3>");
            document.write("Additin: "+(a+b)+"<br>");
            document.write("Substraction: "+(a-b)+"<br>");
            document.write("Multiplication: "+(a*b)+"<br>");
            document.write("Division: "+(a/b)+"<br>");
            document.write("Modulus: "+(a%b)+"<br>");

            document.write("<h3>Comparison Opeerator</h3>");
            document.write("a is greater than b: "+ (a>b));
        </script>
    </body>
</html>
