<!DOCTYPE html>
<html>
    <head>
        <title>Experiment-14 . Create interactive pages using alert, prompt, and confirm.</title>
    </head>
    <body>
        <h2>JavaScript Interactive Page</h2>

        <button onclick="showalert()">Alert Button</button>
        <button onclick="showprompt()">Prompt Box</button>
        <button onclick="showConfirm()">Confirm Box</button>

        <p id="result"></p>

        <script>
            function showalert(){
                alert("Welcome to jvascript!");
            }

            function showprompt(){
                let name = prompt("Enter Your Name:");
                if(name != null && name!=""){
                    document.getElementById("result").innerHTML="Hello "+name+ " welcome.";
                }
                else{
                    document.getElementById("result").innerHTML="You did not enter the name."
                }
            }

            function showConfirm(){
                let choice= confirm("do you want to confirm");
                if(choice==true){
                    document.getElementById("result").innerHTML="You clicked OK.";
                }
                else{
                    document.getElementById("result").innerHTML="You clicked Cancel.";
                }
            }
        </script>
    </body>
</html>
