<!DOCTYPE html>
<html>
    <head>
        <title>Experiment-6 Use CSS selectors (class, id, pseudo-classes) for styling.</title>
        <style>
            h1{
                color:rgb(48, 21, 201);
                text-align:center;
            }
            .class{
                color:green;
                font-size:20px;
            }
            .id{
                color:orange;
                font-size:22px;
            }
            button:hover{
                color:red;
                font-size:24px;
            }
        </style>

    </head>
    <body>
        <h1>CSS Selectors</h1>

        <h2>Class selector</h2>
        <p class="class">
            this is a class selector example.
        </p>

        <h2>ID selector</h2>
        <p id="id">
            this is an ID selector example.
        </p>

        <h2>Pseudo-class selector</h2>
        <button>click over me</button>  
        <input type="text" placeholder="click here ">

        <h2>list Example</h2>
        <ul>
            <li>HTMLL</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>

    </body>

</html>
