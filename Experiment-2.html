<!DOCTYPE html>
<html>
    <head>
        <title>Experiment-2 Design a webpage using tables and include multimedia elements like audio, video, and iframe.
        </title>
    </head>
    <body>
        <h1 align="center"> HTML multimedia webpage` </h1>
        
        <table border="4" width="80%" align="center" cellpadding="15">
            <tr>
                <td align="center">
                <audio src="audio student.mp3" height="200" width="400" controls></audio>
                </td>
            </tr>
            <tr>
                <td align="center">
                <video src="215475.mp4" height="200" width="400" controls></video>
                </td>
            </tr>
            <tr>
                <td align="center">
                <iframe src="Experiment-1.html" width="400" height="100"></iframe>
                </td>
            </tr>
        </table>
    </body>
</html>
