        <title>Experiment-12  Create and use functions in JavaScript</title>
    </head>
    <body>
        <h1>JavaScript Functions</h1>
        <script>
            function greet(){
                document.write("hello! Welcome to Javascript.<br>");
            }
            greet();

            function add(a,b){
                document.write("additioon "+(a+b)+ "<br>");
            }

            add(10,20);

            function multiply(a,b){
                return a*b;
            }

            let result= multiply(5,4);
            document.write("multiplication: "+ result);
        </script>
    </body>
