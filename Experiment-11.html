
<!DOCTYPE html>
<html>
<head>
    <title>Experiment 11 - JavaScript Control Structures</title>
</head>

<body>
    <h1>JavaScript Control Structures</h1>

    <script>
        let marks = 75;

        document.write("<h3>If-Else Statement</h3>");

        if (marks >= 40) {
            document.write("Student is Pass<br>");
        }
        else {
            document.write("Student is Fail<br>");
        }

        document.write("<h3>For Loop</h3>");

        for (let i = 1; i <= 5; i++) {
            document.write(i + "<br>");
        }

        document.write("<h3>While Loop</h3>");

        let j = 1;

        while (j <= 5) {
            document.write(j + "<br>");
            j++;
        }

        document.write("<h3>Do-While Loop</h3>");

        let k = 1;

        do {
            document.write(k + "<br>");
            k++;
        }
        while (k <= 5);

    </script>
</body>
</html>
