<!DOCTYPE html>
<html>
    <head>
        <title>Experiment-5 Apply CSS using inline, internal, and external methods in one page.</title>
        <style>
            body{
                background-color:lightyellow;
                font-family:Arial;
            }
            h1{
                color:blue;
                text-align:center;
            }
            .internal{
                color:green;
                font-size:20px;
            }
        </style>        
        <link rel="stylesheet" href="experi5.css">
    </head>
    <body>
        <h1>CSS styling method</h1>

        <p style="color:red; font-size:22px;">
            This paragraph uses inline css.
        </p>

        <p class="internal">
            This paragraph uses internal css.
        </p>

        <p class="external">
            This paragraph uses external css.
        </p>

    </body>
</html>
