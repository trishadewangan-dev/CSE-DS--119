<!DOCTYPE html>
<html>
    <head>
        <title>Expriment-15 Perform DOM manipulation to change content and styles dynamically.</title>
    </head>
    <body>
        <h2 id="heading">DOM Manipulation in JavaScript</h2>
        <p id="message">Welcome to web Development!</p>
        <button onclick ="changecontent()">change content</button>
        <button onclick ="changestyle()">change style</button>
        <button onclick ="resetPage()">Reset</button>

        <script>
            function changecontent(){
                document.getElementById("message").innerHTML="Content Changed Successfully";
            }

            function changestyle(){
                document.getElementById("heading").style.color="red";
                document.getElementById("message").style.backgroundColor="yellow";
                document.getElementById("message").style.fontSize="25px";
            }

            function resetPage(){
                document.getElementById("heading").style.color="black";
                document.getElementById("message").innerHTML="Welcome to web development!";
                document.getElementById("message").style.backgroundColor="white";
                document.getElementById("message").style.fontSize="16px";
            }
        </script>
    </body>
</html>
