<!DOCTYPE html>
<html>
    <head>
        <title>Experiment-9 Apply advanced CSS features like rounded corners and border images.</title>
        <style>
            body{
                font-family:Arial,sans-serif;
                background-color:lightyellow;
                text-align:center;
                margin:20px;
            }
            h1{
                color:blue;
            }
            .rounded{
                background-color:lightblue;
                border: 3px solid blue;
                border-radius:30px;
                padding:20px;
                margin:20px;
            }
            .border-image{
                border:15px solid transparent;
                border-image:linear-gradient(red,yellow,blue) 1;
                padding:20px;
                margin:20px;
            }
        </style>
    </head>
    <body>
        <h1>Advanced CSS Features</h1>

        <div class="rounded">
            <h2>Rounded Corners</h2>
            <p>This div has rounded corners using the border-radius property.</p>
        </div>

        <div class="border-image">
            <h2>Border Image</h2>
            <p>This div uses a border image created with a linear gradient.</p>
        </div>
    </body>
</html>
